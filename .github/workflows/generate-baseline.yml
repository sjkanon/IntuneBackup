# Regenereert baseline/intune/baseline-v1.0.json uit IntuneTemplate/Baseline_*.json bij
# elke push naar main die die map wijzigt, en opent daar een PR voor — nooit een
# stilzwijgende commit op main, zelfde reden als writeBackBaseline in het gekoppelde
# platform (TEST Policies Platform): een gegenereerd bestand dat niemand review't is
# precies het soort ongeziene wijziging die baseline-drift veroorzaakt.
#
# Run het script lokaal (`node scripts/generate-baseline.js`) om te zien wat een wijziging
# aan een policy-template oplevert vóór je 'm pusht.

name: Genereer baseline uit IntuneTemplate

on:
  push:
    branches: [main]
    paths:
      - "IntuneTemplate/**"
      - "scripts/generate-baseline.js"
      - "scripts/generate-compliance.js"
      - "scripts/export-intunebackup.js"
      - "scripts/check-scope.js"
      - "scripts/set-packages.js"
      - "scripts/lib/**"
      - ".github/workflows/generate-baseline.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Bewaakt dat er geen policy met gemengde device/user-scope bij komt, dat bestands- en
      # policynaam hetzelfde platform en dezelfde scope dragen, dat elk bestand in de map van
      # zijn policytype staat, dat geen twee toegewezen policies dezelfde instelling op een
      # andere waarde zetten, dat het CIPP-pakket in elk template klopt met zijn fase en
      # toewijzing, en dat elke policy controls heeft in de vorm van IntuneTemplate/_controls.json.
      # Blokkerend — het pakket wordt hier bewust niet stilzwijgend rechtgezet: het bepaalt naar
      # wie een policy uitrolt, en dat hoort iemand te zien.
      - name: Controleer scope, indeling, conflicten en normverwijzingen van IntuneTemplate/
        run: node scripts/check-scope.js

      - name: Genereer baseline/intune/baseline-v1.0.json
        run: node scripts/generate-baseline.js
      - name: Genereer de restore-formaten van alle sets
        run: node scripts/export-intunebackup.js
      # Na generate-baseline: de policytabellen tonen de checkId's, en die komen uit de
      # zojuist geschreven baseline.
      - name: Genereer de CIPP-baseline in BaselineTemplate/
        run: node scripts/generate-baseline-template.js
      - name: Genereer de README's in IntuneTemplate/
        run: node scripts/generate-docs.js

      # Conditional Access telt in COMPLIANCE.md alleen mee als ca-controls.json er is. Zonder
      # deze checkout staat er in het document expliciet dat CA ontbreekt. Zet hem aan zodra de
      # CA-repo in CI bereikbaar is — en draai lokaal dan ook mét CA, anders wisselt
      # COMPLIANCE.md bij elke run tussen de twee versies.
      # - name: Haal CA-policies op voor de CA-kant van COMPLIANCE.md
      #   uses: actions/checkout@v5
      #   with:
      #     repository: sjkanon/CA-Policies
      #     path: .ca-policies
      #     token: ${{ secrets.CA_POLICIES_TOKEN }}

      # Na generate-baseline: de verantwoording noemt per control en per NIS2-punt de checkId's
      # uit de zojuist geschreven baseline. --strict is een tweede vangnet naast check-scope.js
      # voor wie alleen dit script draait. Met de CA-checkout hierboven: vervang --no-ca door
      # --ca .ca-policies/controls/ca-controls.json.
      - name: Genereer COMPLIANCE.md (ISO 27001, NIS2, CIS, NIST CSF)
        run: node scripts/generate-compliance.js --strict --no-ca

      - name: Open PR met de gegenereerde baseline (als er iets veranderde)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenereer baseline/intune/baseline-v1.0.json uit IntuneTemplate/"
          title: "Baseline geregenereerd uit IntuneTemplate/"
          body: >
            Automatisch gegenereerd door `.github/workflows/generate-baseline.yml` na een
            wijziging in `IntuneTemplate/`. Controleer de diff — met name nieuwe/verwijderde
            checkId's en gewijzigde `params.settings` — vóór je merget.
            `baseline/intune/baseline-v1.0.json` is de bron voor de `intune`-categorie in de
            baseline-koppeling van TEST Policies Platform (Instellingen →
            Baseline-koppelingen); `export/NativeImport/IntuneBackupAndRestore/` is dezelfde baseline in
            het restore-formaat van de IntuneBackupAndRestore-module. Elke set ernaast gaat naar
            `export/NativeImport/IntuneBackupAndRestore-<SET>/` — apart, zodat een restore van de
            baseline die sets niet meesleept. `COMPLIANCE.md` is de verantwoording naar ISO 27001,
            NIS2, CIS en NIST CSF: kijk bij een gewijzigde fase of mapping of een control van
            status verandert.
          branch: auto/regenerate-baseline
          delete-branch: true
          add-paths: |
            baseline/intune/baseline-v1.0.json
            BaselineTemplate/Baseline.json
            baseline/README.md
            export/NativeImport/**
            OVERZICHT.md
            COMPLIANCE.md
            IntuneTemplate/*.md
            IntuneTemplate/**/*.md
