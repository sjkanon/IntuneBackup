# Regenereert baseline/intune/baseline-v1.0.json uit IntuneTemplate/Baseline_*.json bij
# elke push naar main die die map wijzigt, en opent daar een PR voor — nooit een
# stilzwijgende commit op main, zelfde reden als writeBackBaseline in het gekoppelde
# platform (TEST Policies Platform): een gegenereerd bestand dat niemand review't is
# precies het soort ongeziene wijziging die baseline-drift veroorzaakt.
#
# Run het script lokaal (`node scripts/generate-baseline.js`) om te zien wat een wijziging
# aan een policy-template oplevert vóór je 'm pusht.

name: Genereer baseline uit IntuneTemplate

on:
  push:
    branches: [main]
    paths:
      - "IntuneTemplate/**"
      - "scripts/generate-baseline.js"
      - "scripts/export-intunebackup.js"
      - "scripts/check-scope.js"
      - ".github/workflows/generate-baseline.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Bewaakt dat er geen policy met gemengde device/user-scope bij komt, en dat bestands- en
      # policynaam dezelfde scope dragen. Blokkerend sinds PLAN.md fase 2 (de hernoeming).
      - name: Controleer device/user-scope van IntuneTemplate/
        run: node scripts/check-scope.js

      - name: Genereer baseline/intune/baseline-v1.0.json
        run: node scripts/generate-baseline.js
      - name: Genereer export/IntuneBackupAndRestore/ (restore-formaat)
        run: node scripts/export-intunebackup.js
      - name: Open PR met de gegenereerde baseline (als er iets veranderde)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenereer baseline/intune/baseline-v1.0.json uit IntuneTemplate/"
          title: "Baseline geregenereerd uit IntuneTemplate/"
          body: >
            Automatisch gegenereerd door `.github/workflows/generate-baseline.yml` na een
            wijziging in `IntuneTemplate/`. Controleer de diff — met name nieuwe/verwijderde
            checkId's en gewijzigde `params.settings` — vóór je merget.
            `baseline/intune/baseline-v1.0.json` is de bron voor de `intune`-categorie in de
            baseline-koppeling van TEST Policies Platform (Instellingen →
            Baseline-koppelingen); `export/IntuneBackupAndRestore/` is dezelfde baseline in
            het restore-formaat van de IntuneBackupAndRestore-module.
          branch: auto/regenerate-baseline
          delete-branch: true
          add-paths: |
            baseline/intune/baseline-v1.0.json
            export/IntuneBackupAndRestore/**
