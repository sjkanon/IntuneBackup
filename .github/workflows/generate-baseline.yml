# Regenerates everything derived from IntuneTemplate/ — the restore export, the CIPP baseline and
# the documentation — on every push to main that changes that folder, a script that produces
# the output, or a sidecar source in extras/macos/, and opens a PR for it: never a silent commit
# on main. A generated file that nobody reviews is exactly the kind of unseen change that causes
# baseline drift.
#
# Run the pipeline from scripts/README.md locally to see what a change to a policy template
# produces before you push it.

name: Generate baseline from IntuneTemplate

on:
  push:
    branches: [main]
    paths:
      - "IntuneTemplate/**"
      - "scripts/generate-compliance.js"
      - "scripts/generate-docs.js"
      - "scripts/export-intunebackup.js"
      - "scripts/check-scope.js"
      - "scripts/set-packages.js"
      - "scripts/generate-baseline-template.js"
      - "extras/macos/enrollment/**"
      - "extras/macos/shell-scripts/**"
      - "extras/windows/win32-apps/**"
      - "scripts/generate-app-templates.js"
      - "scripts/lib/**"
      - ".github/workflows/generate-baseline.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Guards that no policy with mixed device/user scope is added, that file name and policy
      # name carry the same platform and scope, that every file sits in the folder of its policy
      # type, that no two assigned policies set the same setting to a different value, that the
      # CIPP package in every template matches its phase and assignment, and that every policy has
      # controls in the form of IntuneTemplate/_controls.json.
      # Blocking — the package is deliberately not silently corrected here: it determines who a
      # policy is deployed to, and someone should see that.
      - name: Check scope, layout, conflicts and standards references of IntuneTemplate/
        run: node scripts/check-scope.js
      # Same reasoning for the description: it is what an admin sees next to the policy in the
      # tenant, derived from `doel`, the assignment and the source. Run set-packages.js locally.
      - name: Check that Package and Description in every template are up to date
        run: node scripts/set-packages.js --check
      # The CIPP application templates carry the install scripts verbatim, and the script refuses
      # when the pinned version, hash or exclusion list differ from the manual package. Blocking
      # for the same reason: what runs as SYSTEM on every device should be a reviewed change.
      - name: Check that the CIPP application templates in AppTemplate/ are up to date
        run: node scripts/generate-app-templates.js --check

      - name: Generate the restore export
        run: node scripts/export-intunebackup.js
      - name: Generate the CIPP baseline in BaselineTemplate/
        run: node scripts/generate-baseline-template.js
      # Writes every document in Dutch, English and French. Texts from the data without a
      # translation in IntuneTemplate/_i18n/ are reported here and stay Dutch in the en/fr files.
      - name: Generate the READMEs in IntuneTemplate/ (nl, en, fr)
        run: node scripts/generate-docs.js

      # Conditional Access only counts in COMPLIANCE.md if ca-controls.json is present. Without
      # this checkout the document states explicitly that CA is missing. Enable it once the CA
      # repo is reachable in CI — and then also run locally with CA, otherwise COMPLIANCE.md
      # flips between the two versions on every run.
      # - name: Fetch CA policies for the CA side of COMPLIANCE.md
      #   uses: actions/checkout@v5
      #   with:
      #     repository: <owner>/CA-Policies
      #     path: .ca-policies
      #     token: ${{ secrets.CA_POLICIES_TOKEN }}

      # --strict is a second safety net next to check-scope.js for anyone who only runs this script. With the CA checkout above: replace
      # --no-ca with --ca .ca-policies/controls/ca-controls.json.
      - name: Generate COMPLIANCE.md (ISO 27001, NIS2, CIS, NIST CSF; nl, en, fr)
        run: node scripts/generate-compliance.js --strict --no-ca

      - name: Open PR with the generated baseline (if anything changed)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate the export, the CIPP baseline and the docs from IntuneTemplate/"
          title: "Baseline regenerated from IntuneTemplate/"
          body: >
            Generated automatically by `.github/workflows/generate-baseline.yml` after a
            change in `IntuneTemplate/`. Review the diff before you merge.
            `export/NativeImport/IntuneBackupAndRestore/` is the baseline in the restore
            format of the IntuneBackupAndRestore module, with the macOS enrolment profiles and shell
            scripts from `extras/macos/` as sidecars; `BaselineTemplate/Baseline.json` is the
            CIPP baseline with its stages and packages. `docs/COMPLIANCE.md` is the accountability to
            ISO 27001, NIS2, CIS and NIST CSF: with a changed phase or mapping, check whether a
            control changes status. Every generated document also exists in English and French
            (`.en.md`, `.fr.md`); a changed `doel`, `note` or `faseWaarom` stays Dutch in those until
            the translation in `IntuneTemplate/_i18n/` is updated — the log of the docs step reports how many.
          branch: auto/regenerate-baseline
          delete-branch: true
          add-paths: |
            BaselineTemplate/Baseline.json
            export/NativeImport/**
            docs/OVERZICHT*.md
            docs/COMPLIANCE*.md
            IntuneTemplate/*.md
            IntuneTemplate/**/*.md
